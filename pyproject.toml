[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcheck"
version = "0.1.0"
description = "Read-only Kubernetes pod health triage CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.1", "kubernetes>=29.0"]

[project.scripts]
podcheck = "podcheck.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.8", "pytest>=8.0", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true
